<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  :root{ --ink:#0e1116; --line:rgba(255,255,255,.14); --text:#e6edf3; --dim:#b6c2cf;
         --new:#3fc8c0; --bad:#ff8a82; --glass:rgba(14,17,22,.42) }
  *{box-sizing:border-box} body{margin:0}
  .wrap{ background:var(--ink); color:var(--text); padding:14px;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:14px; line-height:1.6 }
  .status{ background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:12px; font-size:13px; color:var(--dim) }
  .status.err{ border-color:var(--bad); color:#ffb3ae }
  button.go{ background:var(--new); color:#06201f; border:0; border-radius:8px;
    padding:10px 18px; font-size:15px; font-weight:700 }
  #app{ position:fixed; inset:0; z-index:9; display:none }
  .stage{ position:absolute; inset:0; background:#000; overflow:hidden }
  video,canvas.ov{ position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; transform:scaleX(-1) }
  .warn{ position:absolute; left:0; right:0; top:0; background:rgba(229,83,75,.75);
    color:#fff; font-size:13px; padding:5px 10px; text-align:center }
  .hud{ position:absolute; left:0; right:0; bottom:0; z-index:11;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap }
  .num{ font:700 64px/1 ui-monospace,Menlo,monospace; color:var(--new) }
  .num small{ font:600 13px/1 -apple-system,sans-serif; color:var(--dim); display:block; margin-bottom:4px }
  .side{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end }
  .side button{ background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:9px 13px; font-size:13px }
  .live{ width:100%; font:600 12px ui-monospace,monospace; color:var(--dim);
    display:flex; gap:12px; flex-wrap:wrap }
  .live .ok{ color:var(--new) } .live .ng{ color:var(--bad) }
</style>

<div class="wrap" id="wrap">
  <div class="status" id="status">カメラを使います。「開始」を押すとブラウザが許可を聞いてきます。</div>
  <div id="startbox"><button class="go" id="start">開始</button></div>
</div>

<div id="app">
  <div class="stage">
    <video id="vid" playsinline muted></video>
    <canvas class="ov" id="ov"></canvas>
    <div class="warn" id="warn" style="display:none">腕立ての構えになっていません</div>
  </div>
  <div class="hud">
    <div class="num"><small>回数</small><span id="count">0</span></div>
    <div class="side">
      <button id="reset">リセット</button>
      <button id="copy">記録をコピー</button>
    </div>
    <div class="live" id="live"></div>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const $ = id => document.getElementById(id);
const statusEl = $("status");
const say = (t,e) => { statusEl.textContent=t; statusEl.classList.toggle("err",!!e); };

/* ===== 定数 ===== */
const WINDOW_MS=5000, ENTER=0.7, EXIT=0.3, MIN_HALF=250, MAX_HALF=5000,
      RESET_MS=1000, MAX_AMP_TORSO=1.5, TORSO_HALF_LIFE=3000;
const MIN_AMP_TO_TORSO = 0.15;   // ★修正②：0.08 から引き上げ
const POSTURE_MAX      = 1.35;   // ★修正③：胴長 ÷ 肩幅

/* ===== 回数カウンタ ===== */
class RepCounter{
  constructor(){ this.hard(); }
  hard(){ this.count=0; this.torso=0; this.lastFrame=0; this.forget(); }
  forget(){ this.t=[]; this.v=[]; this.mn=0; this.mx=0; this.isDown=false; this.enteredMs=0; }
  add(now,val){
    this.t.push(now); this.v.push(val);
    while(this.t.length && now-this.t[0]>WINDOW_MS){ this.t.shift(); this.v.shift(); }
    let mn=Infinity,mx=-Infinity;
    for(const x of this.v){ if(x<mn)mn=x; if(x>mx)mx=x; }
    this.mn=mn; this.mx=mx;
  }
  get amp(){ return this.v.length ? this.mx-this.mn : 0; }
  ampToTorso(){ return this.torso>0 ? this.amp/this.torso : 0; }
  onFrame(visible, y, torsoLen, now){
    if(!visible){ this.forget(); return; }
    if(now-this.lastFrame>RESET_MS) this.forget();
    const el = this.lastFrame===0 ? 0 : Math.max(now-this.lastFrame,0);
    this.lastFrame=now;
    this.add(now,y);
    this.torso = Math.max(el<=0 ? this.torso : this.torso*Math.pow(0.5, el/TORSO_HALF_LIFE), torsoLen);
    if(this.ampToTorso()>MAX_AMP_TORSO){
      this.t=[this.t[this.t.length-1]]; this.v=[this.v[this.v.length-1]]; this.mn=this.mx=this.v[0];
    }
    // ★修正①：下りたまま長時間戻らないなら、その下りを無効にする
    if(this.isDown && now-this.enteredMs>MAX_HALF) this.isDown=false;
    if(this.ampToTorso()<MIN_AMP_TO_TORSO) return;
    const span=this.amp, n = span<=0 ? 0 : (this.v[this.v.length-1]-this.mn)/span;
    if(n<EXIT){
      if(!this.isDown) return;
      this.isDown=false;
      const dt=now-this.enteredMs;
      if(dt>=MIN_HALF && dt<=MAX_HALF) this.count++;
    }else if(n>ENTER && !this.isDown){ this.isDown=true; this.enteredMs=now; }
  }
}
const counter = new RepCounter();

/* ===== ランドマーク ===== */
const LS=11,RS=12,LH=23,RH=24;
const BONES=[[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],
             [23,25],[25,27],[24,26],[26,28]];
const usable = p => p && p.visibility>=0.5 && p.x>=0 && p.x<=1 && p.y>=0 && p.y<=1;
// ★修正③：肩と腰だけ見る（膝・足首は見ない）
const upperBodyOk = lm => [[LS,RS],[LH,RH]].every(([a,b]) => usable(lm[a])||usable(lm[b]));

let landmarker, video=$("vid"), ov=$("ov"), octx=ov.getContext("2d");
let lastVideoTime=-1, log=[];

$("start").onclick = async () => {
  $("start").disabled=true;
  try{
    say("カメラを準備しています…");
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=s; await video.play();
  }catch(e){ say(`カメラを開けませんでした（${e.name}）。`,true); return; }
  try{
    say("姿勢検出モデルを読み込んでいます…");
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker=await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
      runningMode:"VIDEO", numPoses:1 });
  }catch(e){ say(`モデルを読み込めませんでした（${e.message||e}）。`,true); return; }
  $("wrap").style.display="none"; $("app").style.display="block";
  requestAnimationFrame(loop);
};

$("reset").onclick = () => { counter.hard(); log=[]; $("count").textContent="0"; };
$("copy").onclick = async () => {
  if(!log.length) return;
  const txt="t_ms,shoulderY,hipY,torso,shoulderWidth,visible\n"+
    log.map(r=>`${r.t},${r.y.toFixed(1)},${r.h.toFixed(1)},${r.torso.toFixed(1)},${r.sw.toFixed(1)},${r.v}`).join("\n");
  try{ await navigator.clipboard.writeText(txt); }
  catch{ const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a);
         a.select(); document.execCommand("copy"); a.remove(); }
  $("copy").textContent=`コピー（${log.length}行）`;
  setTimeout(()=>$("copy").textContent="記録をコピー",1800);
};

function loop(){
  requestAnimationFrame(loop);
  if(video.readyState<2) return;
  const W=video.videoWidth,H=video.videoHeight;
  if(ov.width!==W){ ov.width=W; ov.height=H; }
  if(video.currentTime===lastVideoTime) return;
  lastVideoTime=video.currentTime;

  const now=performance.now();
  const lm=(landmarker.detectForVideo(video,now).landmarks||[])[0];
  octx.clearRect(0,0,W,H);
  if(!lm){ $("warn").style.display="block"; counter.forget(); return; }
  draw(lm,W,H);

  const px=i=>({x:lm[i].x*W,y:lm[i].y*H});
  const sM={x:(px(LS).x+px(RS).x)/2,y:(px(LS).y+px(RS).y)/2};
  const hM={x:(px(LH).x+px(RH).x)/2,y:(px(LH).y+px(RH).y)/2};
  const torso=Math.hypot(sM.x-hM.x,sM.y-hM.y);
  const sw=Math.hypot(px(LS).x-px(RS).x,px(LS).y-px(RS).y);
  const ratio = sw>0 ? torso/sw : 99;
  const visible = upperBodyOk(lm) && ratio<=POSTURE_MAX;
  $("warn").style.display = visible ? "none" : "block";

  counter.onFrame(visible, sM.y, torso, now);
  $("count").textContent = counter.count;
  log.push({t:Math.round(now),y:sM.y,h:hM.y,torso,sw,v:visible?1:0});
  if(log.length>4000) log.shift();

  $("live").innerHTML =
    `<span>構え <b class="${ratio<=POSTURE_MAX?"ok":"ng"}">${ratio.toFixed(2)}</b> ≦ ${POSTURE_MAX}</span>`+
    `<span>振幅 <b class="${counter.ampToTorso()>=MIN_AMP_TO_TORSO?"ok":"ng"}">${counter.ampToTorso().toFixed(2)}</b> ≧ ${MIN_AMP_TO_TORSO}</span>`+
    `<span>${counter.isDown?"下":"上"}</span>`;
}

function draw(lm,W,H){
  octx.strokeStyle="rgba(63,200,192,.85)"; octx.lineWidth=Math.max(2,W/320);
  BONES.forEach(([a,b])=>{ octx.beginPath();
    octx.moveTo(lm[a].x*W,lm[a].y*H); octx.lineTo(lm[b].x*W,lm[b].y*H); octx.stroke(); });
  octx.fillStyle="#fff";
  lm.forEach(p=>{ octx.beginPath(); octx.arc(p.x*W,p.y*H,Math.max(2,W/240),0,7); octx.fill(); });
}
</script>
